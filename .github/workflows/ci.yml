name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: 安装依赖（忽略安装脚本：原生依赖均为包内预编译/napi 分发，杜绝 CI 误触发 node-gyp）
        run: npm ci --ignore-scripts || (sleep 15 && npm ci --ignore-scripts)
      - run: npm run typecheck
      # 先构建再测试：dist 冒烟套件（test/smoke）必须看到发布产物才有意义
      - run: npm run build
      - run: npm test

  # 真实安装端到端：npm pack 出 tarball → 全新目录安装 → bin → init/status → MCP 握手。
  # 覆盖 files 清单、bin 链接、依赖解析、原生模块预编译下载这条用户完整路径。
  pack-e2e:
    name: pack-e2e · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --ignore-scripts || (sleep 15 && npm ci --ignore-scripts)
      - run: npm run build
      - run: node scripts/pack-e2e.mjs
